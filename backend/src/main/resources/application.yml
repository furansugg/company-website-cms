spring:
  application:
    name: cms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cms}
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD:cms_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-a-development-secret-key-must-be-long-enough-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: company-website-cms
  cors:
    # Supports wildcards via setAllowedOriginPatterns (e.g. http://localhost:* for any local port).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  storage:
    root: ${STORAGE_ROOT:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/uploads}
    max-bytes: 10485760
    allowed-image-types: image/jpeg,image/png,image/webp,image/gif,image/svg+xml
    allowed-document-types: application/pdf,text/plain,application/zip
  public-site:
    base-url: ${PUBLIC_SITE_BASE_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    id.devin9997.cms: DEBUG
